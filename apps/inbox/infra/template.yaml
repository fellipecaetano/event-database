AWSTemplateFormatVersion: "2010-09-09"
Description: Private authenticated inbox uploader for event-database

Parameters:
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: "[a-z0-9-]{1,63}"
  DevelopmentOrigin:
    Type: String
    Default: http://localhost:5173
    AllowedPattern: "http://localhost(:[0-9]{1,5})?"
  LambdaCodeBucket:
    Type: String
  LambdaCodeKey:
    Type: String
  AlarmNotificationTopicArn:
    Type: String
    Default: ""

Conditions:
  HasAlarmNotificationTopic: !Not [!Equals [!Ref AlarmNotificationTopicArn, ""]]

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-stale-inbox-uploads
            Status: Enabled
            Prefix: inbox/
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - Content-Type
              - If-None-Match
            AllowedMethods:
              - PUT
            AllowedOrigins:
              - !Sub "https://${Distribution.DomainName}"
              - !Ref DevelopmentOrigin
            MaxAge: 300

  DataBucketTlsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  InboxObjectCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Unexpected inbox object accumulation
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: BucketName
          Value: !Ref DataBucket
        - Name: StorageType
          Value: AllStorageTypes
      EvaluationPeriods: 1
      MetricName: NumberOfObjects
      Namespace: AWS/S3
      Period: 86400
      Statistic: Average
      Threshold: 10000
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmNotificationTopic
        - [!Ref AlarmNotificationTopicArn]
        - !Ref AWS::NoValue

  InboxStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Unexpected inbox storage growth
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: BucketName
          Value: !Ref DataBucket
        - Name: StorageType
          Value: StandardStorage
      EvaluationPeriods: 1
      MetricName: BucketSizeBytes
      Namespace: AWS/S3
      Period: 86400
      Statistic: Average
      Threshold: 2147483648
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmNotificationTopic
        - [!Ref AlarmNotificationTopicArn]
        - !Ref AWS::NoValue

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  WebsiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-website"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: website
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebsiteOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: website
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
      CallbackURLs:
        - !Sub "https://${Distribution.DomainName}"
        - !Ref DevelopmentOrigin
      LogoutURLs:
        - !Sub "https://${Distribution.DomainName}"
        - !Ref DevelopmentOrigin
      GenerateSecret: false
      SupportedIdentityProviders:
        - COGNITO
      UserPoolId: !Ref UserPool

  UploadSignerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-inbox-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${DataBucket.Arn}/inbox/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  UploadSigner:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          CATALOGUE_DATA_BUCKET: !Ref DataBucket
      Handler: create-upload-intents.handler
      MemorySize: 128
      Role: !GetAtt UploadSignerRole.Arn
      Runtime: nodejs22.x
      Timeout: 10

  UploadSignerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${UploadSigner}"
      RetentionInDays: 30

  UploadApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      CorsConfiguration:
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - POST
        AllowOrigins:
          - !Sub "https://${Distribution.DomainName}"
          - !Ref DevelopmentOrigin
        MaxAge: 300
      Name: !Sub "${AWS::StackName}-upload"
      ProtocolType: HTTP

  UploadApiAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref UploadApi
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClient
        Issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
      Name: cognito

  UploadApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref UploadApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UploadSigner.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  UploadApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref UploadApi
      AuthorizationType: JWT
      AuthorizerId: !Ref UploadApiAuthorizer
      RouteKey: POST /upload-intents
      Target: !Join
        - /
        - - integrations
          - !Ref UploadApiIntegration

  UploadApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref UploadApi
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      StageName: $default

  UploadApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref UploadSigner
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${UploadApi}/*/*"

Outputs:
  ApiUrl:
    Value: !GetAtt UploadApi.ApiEndpoint
  CognitoAuthority:
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
  CognitoClientId:
    Value: !Ref UserPoolClient
  DataBucket:
    Value: !Ref DataBucket
  DistributionId:
    Value: !Ref Distribution
  Region:
    Value: !Ref AWS::Region
  UserPoolId:
    Value: !Ref UserPool
  WebsiteBucket:
    Value: !Ref WebsiteBucket
  WebsiteUrl:
    Value: !Sub "https://${Distribution.DomainName}"
